.btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(212,175,85,.18);border-color:var(--g2)}
.btn:focus-visible{outline:2px solid var(--g2);outline-offset:3px}
.btn.gold{background:var(--gold);background-size:200% 100%;color:#1a1204;border-color:transparent;transition:transform .2s,box-shadow .2s,background-position .4s}
.btn.gold:hover{background-position:100% 0}
.ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--g1);display:grid;place-items:center;color:var(--g2);flex:none}
.gold .ic{border-color:rgba(26,18,4,.45);color:#1a1204}
.ic svg{width:24px;height:24px}
.tx{flex:1;min-width:0}
.tx b{display:block;font:700 1.35rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tx small{font-size:.9rem;color:var(--mut)}.gold .tx small{color:rgba(26,18,4,.75)}
.arr{width:20px;height:20px;flex:none;opacity:.8}
.hrs{margin:34px 0 6px;color:var(--mut);font-size:.95rem;animation:in .8s .55s both}
